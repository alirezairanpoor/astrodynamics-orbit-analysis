[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrodynamics-orbit-analysis"
version = "0.1.0"
description = "Python implementations for astrodynamics, orbit propagation, determination, and trajectory analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "numpy"
]

[tool.setuptools.packages.find]
where = ["src"]